<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>🌊 AI 進化智慧水族箱 - 圖片版</title>
<style>
:root{--primary:#00e5ff;--bg-dark:#051622;--panel-bg:#081a29;}
body{margin:0;font-family:"Microsoft JhengHei",sans-serif;background:var(--bg-dark);color:#fff;overflow:hidden;height:100vh;display:flex;flex-direction:column;}
h2{text-align:center;margin:5px 0;color:var(--primary);font-size:20px;text-shadow:0 0 8px rgba(0,229,255,.5);}
#tank{width:100%;flex-grow:1;position:relative;overflow:hidden;background:linear-gradient(to bottom,#00bfff,#001b33 70%,#000a11);border-bottom:2px solid var(--primary);cursor:crosshair;}
.fish{position:absolute;user-select:none;z-index:10;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.fish-body{width:60px;height:60px;object-fit:contain;transition:filter .3s;animation:swim 1.4s ease-in-out infinite alternate;}
@keyframes swim{from{transform:translateY(0) scale(var(--size-factor,1));}to{transform:translateY(-4px) scale(var(--size-factor,1));}}
.fish.dead-fish .fish-body{filter:grayscale(100%) opacity(.5);animation:none;transform:rotate(180deg) scale(var(--size-factor,1));}
.fish-badge{font-size:11px;background:rgba(0,0,0,.6);padding:1px 4px;border-radius:4px;margin-bottom:2px;white-space:nowrap;pointer-events:none;border:1px solid rgba(255,255,255,.1);}
.fish-badge.hide-badge{display:none;}
.food-item{position:absolute;font-size:20px;pointer-events:none;z-index:600;line-height:1;}
#control-center{height:180px;background:var(--panel-bg);display:flex;padding:15px;gap:15px;box-sizing:border-box;border-top:1px solid rgba(0,229,255,.2);z-index:900;}
.bottom-feed-matrix-zone{flex:1;background:rgba(255,255,255,.03);border-radius:10px;border:1px solid rgba(0,229,255,.2);padding:12px;display:flex;flex-direction:column;overflow:hidden;}
.bottom-matrix-title{font-size:13px;margin-bottom:8px;color:var(--primary);font-weight:bold;}
.bottom-matrix-grid-wrapper{overflow-y:auto;flex-grow:1;}
.bottom-matrix-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(65px,1fr));gap:6px;}
.bottom-quick-cell{background:#162d3d;border:1px solid #1e3a52;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;min-height:48px;font-size:11px;transition:.2s;}
.bottom-quick-cell.active-fish{border-color:var(--primary);background:#1a4a6e;}
.bottom-quick-cell.has-fed{opacity:.7;border-color:#00ffcc;background:#123e5e;}
.bottom-quick-cell.has-fed .bottom-cell-num{color:#00ffcc;}
.bottom-quick-cell.is-dead-quick-cell{background:#3a1616;border-color:#ff3d00;box-shadow:inset 0 0 5px rgba(255,61,0,.2);}
.bottom-quick-cell.is-dead-quick-cell:hover{background:#4a1c1c;}
.bottom-cell-icon{width:22px;height:22px;object-fit:contain;margin-bottom:1px;}
.bottom-cell-num{font-size:10px;font-weight:bold;opacity:.8;}
.bottom-action-zone{width:180px;display:flex;flex-direction:column;justify-content:center;gap:8px;}
.btn-all{background:#ff9800;border:none;border-radius:8px;padding:12px;font-weight:bold;cursor:pointer;font-size:14px;text-align:center;color:#000;}
.btn-undo-all{background:#607d8b;border:none;border-radius:8px;padding:12px;font-weight:bold;cursor:pointer;font-size:14px;text-align:center;color:#fff;}
#save-toast{position:absolute;top:10px;right:80px;background:rgba(0,229,255,.2);border:1px solid var(--primary);color:var(--primary);padding:3px 10px;border-radius:4px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:2000;}
</style>
</head>
<body>

<h2>🌊 AI 進化智慧水族箱 - 圖片版</h2>

<div id="tank" onclick="deselect()">
  <div id="save-toast">💾 已自動儲存</div>
</div>

<div id="control-center">
  <div class="bottom-feed-matrix-zone">
    <div class="bottom-matrix-title">📅 快速點名餵食面板（活魚餵 🍖，死魚餵 💊 復活）</div>
    <div class="bottom-matrix-grid-wrapper">
      <div class="bottom-matrix-grid" id="bottom-matrix-grid"></div>
    </div>
  </div>
  <div class="bottom-action-zone">
    <button class="btn-all" onclick="doFeedAll()">🌟 群體投食 / 復活</button>
    <button class="btn-undo-all" onclick="doUndoAllFeeding()">↩️ 全體撤銷餵食</button>
  </div>
</div>

<script>
/* ====== 對應你 images/ 資料夾裡的 21 張圖 ====== */
const bioList = [
  { name:'生物1',  folder:'01451e63-6f39-49a6-a46f-21aa565df275' },
  { name:'生物2',  folder:'03740734-4f0e-40a0-a8f8-3ac1620f7867' },
  { name:'生物3',  folder:'05e96568-5877-4d15-a01b-7e903411fe87' },
  { name:'生物4',  folder:'1251007e-3d6c-4b3b-b09e-cb624badb0b8' },
  { name:'生物5',  folder:'27364f40-92ce-404f-be58-04d7b5377ae5' },
  { name:'生物6',  folder:'2790235b-2a7f-4b90-a336-08d5fbdcaeca' },
  { name:'生物7',  folder:'3e8bc30-0075-4031-9587-45e7c4e76201' },
  { name:'生物8',  folder:'52edca66-fca1-41db-8e43-164e8bb6a456' },
  { name:'生物9',  folder:'53d0430e-5907-4223-b52e-c574e00809ae' },
  { name:'生物10', folder:'5612beee-c51f-452b-bd98-78e3e1865872' },
  { name:'生物11', folder:'6399b98f-d4c5-46d4-b660-3ff53f214ae8' },
  { name:'生物12', folder:'69b442f8-5b04-422b-9dd6-78f45cfb6a95' },
  { name:'生物13', folder:'6ab4dd03-9322-40ca-bb11-ffa3952908d4' },
  { name:'生物14', folder:'7eaa45fd-8f4d-4bd6-a366-0d1f8f5330c0' },
  { name:'生物15', folder:'8a7498b6-cf5a-4bcd-9ab0-8ee466471881' },
  { name:'生物16', folder:'a0b634a2-e3cc-4cbf-885d-b2380689a050' },
  { name:'生物17', folder:'af1e226f-2a6b-4a9e-84d6-b29b0ce969f9' },
  { name:'生物18', folder:'b17b404b-8bad-435f-bb3b-0fb04ae3ef46' },
  { name:'生物19', folder:'e62e341e-2876-4fb5-836c-5c2db087f09a' },
  { name:'生物20', folder:'e9966c42-1d78-4b37-aa19-33bc3f0e66d4' },
  { name:'生物21', folder:'f570ba71-24f6-49be-a4f4-be79f04f9d05' }
];

const config = { speed:1, geneMode:'single', fishCount:26, showId:true, showDays:true, maxDays:10 };
let fishArray = [], foodsArray = [], currentId = null;
const tank = document.getElementById('tank');

function img(t){ return `images/${bioList[t].folder}.png`; }
function getTodayString(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function checkIsDead(s){ if(!s)return false; const a=new Date(s), b=new Date(getTodayString()); return Math.floor((b-a)/86400000)>1; }

function init(){ buildAquarium(); (function loop(){ render(); requestAnimationFrame(loop); })(); }

function buildAquarium(){
  deselect();
  fishArray.forEach(f=>f.domFish&&f.domFish.remove());
  foodsArray.forEach(f=>f.dom&&f.dom.remove());
  foodsArray = []; fishArray = [];
  document.getElementById('bottom-matrix-grid').innerHTML = '';

  let saved = {};
  try{ saved = JSON.parse(localStorage.getItem('aq_v6')) || {}; }catch(e){}

  for(let i=0;i<config.fishCount;i++){
    const id = i+1;
    const initT = Math.floor(Math.random()*bioList.length);
    let g=0, c=1, lf='', dead=false;
    if(saved[id]){
      g = saved[id].growthDays || 0;
      c = saved[id].currentSize || 1;
      lf = saved[id].lastFedDate || '';
      dead = saved[id].isDead || false;
      if(!dead && checkIsDead(lf)){ dead=true; g=0; c=1; }
    }

    const f = {
      id,
      type: saved[id] ? saved[id].type : initT,
      x: 5 + Math.random()*85,
      y: dead ? 85 : 15 + Math.random()*65,
      dx: dead ? 0 : (Math.random()-.5)*.4,
      dy: dead ? 0 : (Math.random()-.5)*.3,
      targetFood: null,
      growthDays: g,
      currentSize: c,
      lastFedDate: lf,
      isDead: dead
    };

    const el = document.createElement('div');
    el.className = 'fish' + (dead ? ' dead-fish' : '');
    el.onclick = e => { e.stopPropagation(); selectFish(id); };

    const bd = document.createElement('div');
    bd.className = 'fish-badge';
    el.appendChild(bd);

    const body = document.createElement('img');
    body.className = 'fish-body';
    body.src = img(f.type);
    body.onerror = function(){ this.style.opacity = '.3'; };
    el.appendChild(body);

    tank.appendChild(el);
    f.domFish = el;
    f.domFishBody = body;
    f.domFishBadge = bd;
    body.style.setProperty('--size-factor', c);

    const bc = document.createElement('div');
    bc.className = 'bottom-quick-cell' + (dead ? ' is-dead-quick-cell' : '');
    bc.onclick = e => { e.stopPropagation(); quickFeed(id); };

    const bi = document.createElement('img');
    bi.className = 'bottom-cell-icon';
    bi.src = img(f.type);

    const bn = document.createElement('span');
    bn.className = 'bottom-cell-num';

    bc.appendChild(bi);
    bc.appendChild(bn);
    document.getElementById('bottom-matrix-grid').appendChild(bc);

    f.domBottomCell = bc;
    f.domBottomCellIcon = bi;
    f.domBottomCellNum = bn;

    fishArray.push(f);
  }
  saveProgress();
}

function quickFeed(id){
  selectFish(id);
  const f = fishArray.find(x => x.id === id);
  if(!f) return;
  if(f.lastFedDate === getTodayString() && !f.targetFood){ cancelFeeding(id); return; }
  if(!f.targetFood) spawnFood(f);
}

function spawnFood(f){
  const e = document.createElement('div');
  e.className = 'food-item';
  e.innerText = f.isDead ? '💊' : '🍖';
  const x = f.x + (Math.random()-.5)*8;
  e.style.left = x + '%';
  e.style.top = '0%';
  tank.appendChild(e);
  const o = { id: Date.now()+'-'+f.id, x, y:0, dom:e, isEaten:false, isPill:f.isDead };
  foodsArray.push(o);
  f.targetFood = o;
}

function cancelFeeding(id){
  const f = fishArray.find(x => x.id === id);
  if(!f) return;
  if(f.targetFood){
    f.targetFood.dom.remove();
    foodsArray = foodsArray.filter(o => o.id !== f.targetFood.id);
    f.targetFood = null;
  }
  if(f.lastFedDate === getTodayString()){
    if(!f.isDead){
      f.growthDays = Math.max(0, f.growthDays - 1);
      const m = Math.floor(f.growthDays / config.maxDays);
      f.currentSize = parseFloat((1 + m*.2).toFixed(1));
    }
    const y = new Date(); y.setDate(y.getDate()-1);
    f.lastFedDate = `${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,'0')}-${String(y.getDate()).padStart(2,'0')}`;
    saveProgress();
  }
}

function doFeedAll(){
  const t = getTodayString();
  fishArray.forEach(f => {
    if(f.isDead && !f.targetFood) spawnFood(f);
    else if(!f.isDead && f.lastFedDate !== t && !f.targetFood) spawnFood(f);
  });
}

function doUndoAllFeeding(){ fishArray.forEach(f => cancelFeeding(f.id)); }
function selectFish(id){ currentId = id; }
function deselect(){ currentId = null; }

function saveProgress(){
  const d = {};
  fishArray.forEach(f => {
    d[f.id] = { type:f.type, growthDays:f.growthDays, currentSize:f.currentSize, lastFedDate:f.lastFedDate, isDead:f.isDead };
  });
  localStorage.setItem('aq_v6', JSON.stringify(d));
  const t = document.getElementById('save-toast');
  t.style.opacity = '1';
  setTimeout(() => t.style.opacity = '0', 800);
}

function render(){
  const today = getTodayString();

  foodsArray.forEach(f => {
    if(!f.isEaten){ f.y += .4; if(f.y > 90) f.y = 90; f.dom.style.top = f.y + '%'; }
  });

  fishArray.forEach(f => {
    if(f.isDead){
      if(f.targetFood && f.targetFood.isPill){
        const o = f.targetFood;
        const dx = o.x - f.x, dy = o.y - f.y, d = Math.hypot(dx, dy);
        if(d < 4){
          o.isEaten = true; o.dom.remove();
          foodsArray = foodsArray.filter(x => x.id !== o.id);
          f.targetFood = null;
          f.isDead = false; f.growthDays = 0; f.currentSize = 1; f.lastFedDate = today;
          f.dx = (Math.random()-.5)*.4; f.dy = (Math.random()-.5)*.3;
          saveProgress();
        } else {
          f.dx = dx/d*.3; f.dy = dy/d*.3;
          f.x += f.dx; f.y += f.dy;
        }
      } else {
        f.dx = 0; f.dy = 0;
        f.y = Math.min(88, f.y + .5);
      }
      f.domFish.classList.add('dead-fish');
      f.domFishBody.style.setProperty('--size-factor', f.currentSize);
    } else {
      f.domFish.classList.remove('dead-fish');
      if(f.targetFood){
        const o = f.targetFood;
        const dx = o.x - f.x, dy = o.y - f.y, d = Math.hypot(dx, dy);
        if(d < 4){
          o.isEaten = true; o.dom.remove();
          foodsArray = foodsArray.filter(x => x.id !== o.id);
          f.targetFood = null;
          if(f.lastFedDate !== today){
            f.lastFedDate = today;
            f.growthDays++;
            const m = Math.floor(f.growthDays / config.maxDays);
            f.currentSize = parseFloat((1 + m*.2).toFixed(1));
            saveProgress();
          }
        } else {
          f.dx = dx/d*.5; f.dy = dy/d*.5;
        }
      } else {
        if(Math.random() < .015){
          f.dx = (Math.random()-.5)*.5;
          f.dy = (Math.random()-.5)*.4;
        }
      }
      f.x += f.dx; f.y += f.dy;
      if(f.x < 2){ f.x = 2; f.dx *= -1; }
      if(f.x > 94){ f.x = 94; f.dx *= -1; }
      if(f.y < 15){ f.y = 15; f.dy *= -1; }
      if(f.y > 88){ f.y = 88; f.dy *= -1; }
      const flip = f.dx > 0 ? 'scaleX(-1)' : 'scaleX(1)';
      f.domFishBody.style.transform = `${flip} scale(${f.currentSize})`;
    }

    f.domFish.style.left = f.x + '%';
    f.domFish.style.top = f.y + '%';

    let t = '';
    if(config.showId) t += '#' + f.id + ' ';
    if(config.showDays) t += (f.isDead ? '💀' : '📅' + f.growthDays + 'd');
    f.domFishBadge.textContent = t;
    f.domFishBadge.className = 'fish-badge' + ((!config.showId && !config.showDays) ? ' hide-badge' : '');

    if(f.domBottomCell){
      f.domBottomCellIcon.src = img(f.type);
      if(f.isDead){
        f.domBottomCell.className = 'bottom-quick-cell is-dead-quick-cell';
        f.domBottomCellNum.textContent = `#${f.id} 💊`;
      } else if(f.lastFedDate === today){
        f.domBottomCell.className = 'bottom-quick-cell has-fed';
        f.domBottomCellNum.textContent = `#${f.id} ✔️ ${f.growthDays}d`;
      } else {
        f.domBottomCell.className = 'bottom-quick-cell' + (f.id === currentId ? ' active-fish' : '');
        f.domBottomCellNum.textContent = `#${f.id} (${f.growthDays}d)`;
      }
    }
  });
}

window.onload = init;
</script>
</body>
</html>
